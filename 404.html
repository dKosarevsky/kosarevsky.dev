<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a09">
  <title>404 — Kosarevsky</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-content:center;padding:24px;box-sizing:border-box;background:#080a09;color:#edf0e6;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    h1{font-size:clamp(90px,25vw,220px);margin:0;letter-spacing:-.08em;color:#c8ff64}
    p{color:#a1ab96;line-height:1.7}
    a,button{display:inline-block;margin-top:20px;color:#c8ff64}
    button{background:none;border:1px solid #4a563a;padding:10px;cursor:pointer}
    button[aria-pressed=true]{background:#c8ff64;color:#080a09}
    a:focus-visible,button:focus-visible{outline:2px solid #c8ff64;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <span id="label">KOSAREVSKY.DEV / OUT OF ORBIT</span>
    <h1>404.</h1>
    <p id="message">This part of the universe is still unexplored.</p>
    <a id="home" href="https://kosarevsky.dev/">Back to the studio ↗</a>
    <div role="group" id="languages" aria-label="Language">
      <button type="button" data-lang="en" lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="ru" lang="ru" aria-pressed="false">Русский</button>
      <button type="button" data-lang="zh" lang="zh-Hans" aria-pressed="false">简体中文</button>
    </div>
  </main>
  <script>
    const copy = {
      en: ['KOSAREVSKY.DEV / OUT OF ORBIT', 'This part of the universe is still unexplored.', 'Back to the studio ↗', 'Language'],
      ru: ['KOSAREVSKY.DEV / ВНЕ ОРБИТЫ', 'Эта часть вселенной пока не исследована.', 'Вернуться в студию ↗', 'Язык'],
      zh: ['KOSAREVSKY.DEV / 偏离轨道', '这片宇宙，还有待探索。', '返回工作室 ↗', '语言'],
    };
    function language(code, persist = false) {
      if (!Object.hasOwn(copy, code)) code = 'en';
      document.documentElement.lang = code === 'zh' ? 'zh-Hans' : code;
      ['label', 'message', 'home'].forEach((id, index) => {
        document.getElementById(id).textContent = copy[code][index];
      });
      document.getElementById('languages').setAttribute('aria-label', copy[code][3]);
      document.getElementById('home').href = 'https://kosarevsky.dev/' + (code === 'en' ? '' : '?lang=' + code);
      document.querySelectorAll('[data-lang]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === code));
      });
      if (persist) {
        try { localStorage.setItem('kosarevsky-language', code); } catch {}
      }
    }
    let saved;
    try { saved = localStorage.getItem('kosarevsky-language'); } catch {}
    const query = new URL(location.href).searchParams.get('lang');
    language(query !== null ? query : saved || 'en');
    document.querySelectorAll('[data-lang]').forEach((button) => {
      button.addEventListener('click', () => language(button.dataset.lang, true));
    });
  </script>
</body>
</html>
